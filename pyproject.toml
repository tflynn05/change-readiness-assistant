[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "change-readiness-assistant"
version = "0.1.0"
description = "Grounded, cited answers for platform and AI rollout planning, with an evaluation pipeline."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tim Flynn" }]
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.0",
  "mcp>=2.0",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
files = ["pypdf>=4.0", "fonttools>=4.0", "python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1"]
dev = ["pytest>=8.0"]

[project.scripts]
cra = "cra.cli:main"

[tool.setuptools]
packages = ["cra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
